name: backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'

defaults:
  run:
    working-directory: apps/backend

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myboke
          POSTGRES_PASSWORD: myboke
          POSTGRES_DB: myboke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myboke -d myboke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://myboke:myboke@localhost:5432/myboke?schema=public
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      PORT: '4000'
      E2E_BASE: http://localhost:4000/v1
      THROTTLE_LIMIT: '100000'
      THROTTLE_AUTH_LIMIT: '100000'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Migrations
        run: pnpm prisma:deploy

      - name: Seed plans
        run: pnpm prisma:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E (server + suite)
        run: |
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/v1/health/ready && break
            sleep 1
          done
          node test/e2e/api.e2e.mjs
          kill %1 || true

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/api.log
