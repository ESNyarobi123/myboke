<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B37A1"/>
      <stop offset="38%"  stop-color="#0269E9"/>
      <stop offset="72%"  stop-color="#0A9CBF"/>
      <stop offset="100%" stop-color="#16A760"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#brand)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- ===== Open box (isometric) ===== -->
  <!-- Top face -->
  <path d="M256 132 L372 190 L256 248 L140 190 Z"
        fill="#FFFFFF" opacity="0.98"/>

  <!-- Left inner face -->
  <path d="M140 190 L256 248 L256 386 L140 328 Z"
        fill="#FFFFFF" opacity="0.80"/>

  <!-- Right inner face -->
  <path d="M372 190 L256 248 L256 386 L372 328 Z"
        fill="#FFFFFF" opacity="0.58"/>

  <!-- Lid flaps (small, above top face) -->
  <path d="M140 190 L256 132 L256 96 Z" fill="#FFFFFF" opacity="0.42"/>
  <path d="M372 190 L256 132 L256 96 Z" fill="#FFFFFF" opacity="0.30"/>

  <!-- Seam lines for definition -->
  <path d="M256 132 L256 248" stroke="#0B37A1" stroke-opacity="0.18" stroke-width="4"/>
  <path d="M140 190 L140 328" stroke="#0B37A1" stroke-opacity="0.10" stroke-width="4"/>
  <path d="M372 190 L372 328" stroke="#0B37A1" stroke-opacity="0.10" stroke-width="4"/>

  <!-- ===== Lime accent: rising value ===== -->
  <g>
    <rect x="196" y="286" width="26" height="42" rx="13" fill="#FFFFFF" opacity="0.55"/>
    <rect x="236" y="266" width="26" height="62" rx="13" fill="#FFFFFF" opacity="0.72"/>
    <rect x="276" y="242" width="26" height="86" rx="13" fill="#73D31C"/>
  </g>
</svg>
