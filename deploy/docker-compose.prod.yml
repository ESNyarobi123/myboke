services:
  postgres:
    image: postgres:16-alpine
    container_name: myboke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myboke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myboke
    volumes:
      - myboke_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myboke -d myboke"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: myboke-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - myboke_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 96m

  api:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: myboke-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: v1
      DATABASE_URL: postgresql://myboke:${POSTGRES_PASSWORD}@postgres:5432/myboke?schema=public
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: https://apiboke.yunigo.online
      CORS_ORIGINS: https://myboke.yunigo.online,https://apiboke.yunigo.online
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - myboke_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 450m

volumes:
  myboke_pg:
  myboke_redis:
  myboke_storage:
